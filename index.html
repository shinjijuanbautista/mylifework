<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLifeWork</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MyLifeWork</h1>
    <p>Rutina, disciplina y trabajo, día a día.</p>
    <div id="usuario-barra" class="oculto">
      <span id="usuario-email"></span>
      <button id="btn-salir" type="button">Salir</button>
    </div>
  </header>

  <main>
    <section id="auth">
      <h2 id="auth-titulo">Iniciar sesión</h2>
      <form id="form-auth">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" required>
        <button type="submit" id="auth-boton">Entrar</button>
      </form>
      <p id="auth-error" class="error"></p>
      <p class="auth-cambio">
        <span id="auth-texto">¿No tenés cuenta?</span>
        <a href="#" id="auth-cambiar">Registrate</a>
      </p>
    </section>

    <section id="gastos" class="oculto">
      <h2>Gastos del mes</h2>

      <div class="total">
        <span>Total del mes</span>
        <strong id="total">$0</strong>
      </div>

      <form id="form-gasto">
        <input type="text" id="descripcion" placeholder="Descripción (ej: Supermercado)" required>
        <input type="number" id="monto" placeholder="Monto" min="0" step="0.01" required>
        <select id="categoria">
          <option>Comida</option>
          <option>Transporte</option>
          <option>Servicios</option>
          <option>Ocio</option>
          <option>Otros</option>
        </select>
        <button type="submit">Agregar gasto</button>
      </form>

      <ul id="lista-gastos"></ul>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
